name: MATLAB CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-uav-mission:
    name: Single UAV Mission
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: >
            Simulink
            UAV_Toolbox
            Navigation_Toolbox
            Robotics_System_Toolbox
            Control_System_Toolbox
            Stateflow

      - name: Run single-UAV acceptance simulation
        uses: matlab-actions/run-command@v3
        with:
          command: |
            proj = openProject(pwd);
            set(groot, "defaultFigureVisible", "off");
            run(fullfile(proj.RootFolder, "scripts", "runSingleUav.m"));
