name: MATLAB CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-uav-mission:
    name: Nominal Single-UAV Telemetry
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB R2026a
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: >
            Simulink
            UAV_Toolbox
            Navigation_Toolbox
            Robotics_System_Toolbox
            Control_System_Toolbox
            Stateflow

      - name: Compile model and validate telemetry pipeline
        uses: matlab-actions/run-command@v3
        with:
          command: |
            proj = openProject(pwd);
            projectRoot = string(proj.RootFolder);
            modelName = "ares_single_uav_top";

            set(groot, "defaultFigureVisible", "off");

            setupScript = fullfile( ...
                projectRoot, ...
                "scripts", ...
                "setupSingleUavBusObjects.m");

            initializationScript = fullfile( ...
                projectRoot, ...
                "scripts", ...
                "initializeSingleUav.m");

            captureScript = fullfile( ...
                projectRoot, ...
                "scripts", ...
                "captureNominalBaselineSingleUav.m");

            validationScript = fullfile( ...
                projectRoot, ...
                "scripts", ...
                "validateNominalBaselineTelemetry.m");

            assert(isfile(setupScript), ...
                "ARES:MissingCIScript", ...
                "Missing bus setup script: %s", ...
                setupScript);

            assert(isfile(initializationScript), ...
                "ARES:MissingCIScript", ...
                "Missing initialization script: %s", ...
                initializationScript);

            assert(isfile(captureScript), ...
                "ARES:MissingCIScript", ...
                "Missing nominal capture script: %s", ...
                captureScript);

            assert(isfile(validationScript), ...
                "ARES:MissingCIScript", ...
                "Missing telemetry validation script: %s", ...
                validationScript);

            addpath(fullfile(projectRoot, "scripts"));

            % Ensure the preflight does not inherit experimental overrides.
            clear SingleUavConfigOverride
            clear SingleUavLidarScheduleOverride

            run(setupScript);
            run(initializationScript);

            requiredBusNames = [
                "uavGuidanceEnvironmentBus"
                "MultirotorGuidanceEnvironmentBus"
                "uavGuidanceControlBus"
                "PlatformMotionBus"
                ];

            for busIndex = 1:numel(requiredBusNames)
                busName = requiredBusNames(busIndex);

                assert(evalin( ...
                    "base", ...
                    sprintf('exist("%s", "var") == 1', busName)), ...
                    "ARES:MissingBusObject", ...
                    "Required bus object does not exist: %s", ...
                    busName);

                busObject = evalin("base", char(busName));

                assert(isa(busObject, "Simulink.Bus"), ...
                    "ARES:InvalidBusObject", ...
                    "%s is not a Simulink.Bus.", ...
                    busName);
            end

            singlePrecisionBusNames = [
                "uavGuidanceEnvironmentBus"
                "MultirotorGuidanceEnvironmentBus"
                "uavGuidanceControlBus"
                ];

            for busIndex = 1:numel(singlePrecisionBusNames)
                busName = singlePrecisionBusNames(busIndex);
                busObject = evalin("base", char(busName));

                elementTypes = string( ...
                    {busObject.Elements.DataType});

                assert(all(elementTypes == "single"), ...
                    "ARES:InvalidBusPrecision", ...
                    "%s must contain single-precision elements.", ...
                    busName);
            end

            load_system(modelName);

            assert( ...
                string(get_param( ...
                    modelName + "/Bus Creator2", ...
                    "OutDataTypeStr")) == ...
                    "Bus: uavGuidanceEnvironmentBus", ...
                "ARES:EnvironmentBusMismatch", ...
                "Environment Bus Creator has the wrong output type.");

            assert( ...
                string(get_param( ...
                    modelName + ...
                    "/Quadrotor Plant/EnvironmentSignalSpecification", ...
                    "OutDataTypeStr")) == ...
                    "Bus: uavGuidanceEnvironmentBus", ...
                "ARES:EnvironmentBusMismatch", ...
                "Environment Signal Specification has the wrong type.");

            set_param( ...
                modelName, ...
                "SimulationCommand", ...
                "update");

            close_system(modelName, 0);

            fprintf("\nPASS: Model compilation preflight completed.\n");

            % Run a fresh nominal baseline episode.
            run(captureScript);

            assert(exist("telemetryPath", "var") == 1, ...
                "ARES:MissingTelemetryPath", ...
                "Capture script did not create telemetryPath.");

            assert(isfile(telemetryPath), ...
                "ARES:MissingTelemetryFile", ...
                "Telemetry file was not saved: %s", ...
                telemetryPath);

            assert(exist("manifestPath", "var") == 1, ...
                "ARES:MissingManifestPath", ...
                "Capture script did not create manifestPath.");

            assert(isfile(manifestPath), ...
                "ARES:MissingManifestFile", ...
                "Manifest file was not saved: %s", ...
                manifestPath);

            telemetryFile = load(telemetryPath);

            assert(isfield(telemetryFile, "telemetry"), ...
                "ARES:InvalidTelemetryFile", ...
                "Saved MAT file does not contain telemetry.");

            capturedTelemetry = telemetryFile.telemetry;

            requiredLidarSignals = [
                "nominal_lidar_ranges_m"
                "nominal_lidar_valid_return_mask"
                "nominal_observation"
                ];

            assert(isfield(capturedTelemetry, "signals"), ...
                "ARES:InvalidTelemetry", ...
                "Telemetry does not contain a signals structure.");

            for signalIndex = 1:numel(requiredLidarSignals)
                signalName = requiredLidarSignals(signalIndex);

                assert(isfield( ...
                    capturedTelemetry.signals, ...
                    signalName), ...
                    "ARES:MissingLidarSignal", ...
                    "Missing LiDAR signal: %s", ...
                    signalName);
            end

            assert(isfield(capturedTelemetry, "lidarMetadata"), ...
                "ARES:MissingLidarMetadata", ...
                "Telemetry does not contain lidarMetadata.");

            lidarMetadata = capturedTelemetry.lidarMetadata;

            assert( ...
                lidarMetadata.observationDimension == ...
                    prod(lidarMetadata.gridSize), ...
                "ARES:InvalidObservationDimension", ...
                "LiDAR grid size and observation dimension disagree.");

            assert(lidarMetadata.numberOfScans > 0, ...
                "ARES:EmptyLidarDataset", ...
                "No LiDAR scans were captured.");

            assert(lidarMetadata.validReturnCount > 0, ...
                "ARES:NoValidLidarReturns", ...
                "No valid LiDAR returns were captured.");

            % Performs matrix checks and produces validation figures.
            report = validateNominalBaselineTelemetry(telemetryPath);

            fprintf("\nPASS: Nominal telemetry pipeline validated.\n");
            fprintf("Manifest: %s\n", manifestPath);
            fprintf("Telemetry: %s\n", telemetryPath);
            fprintf("LiDAR scans: %d\n", ...
                lidarMetadata.numberOfScans);
            fprintf("Observation dimension: %d\n", ...
                lidarMetadata.observationDimension);
            fprintf("Valid return fraction: %.6f\n", ...
                lidarMetadata.validReturnFraction);

      - name: Upload nominal telemetry and validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nominal-single-uav-telemetry-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            data/raw/**/manifest.json
            data/raw/**/*_telemetry.mat
            data/raw/**/validation/*.png
            data/raw/**/validation/*.mat