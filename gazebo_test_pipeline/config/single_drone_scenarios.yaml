# Single-drone test matrix for the Gazebo pipeline.
#
# Every scenario flies the selected controller on the unchanged ARES building
# map. "seeds" picks the lidar outage schedule (same generator and seed as
# MATLAB's outageSchedule) and the wind realisation.

campaign: single_drone

# System under test.
#   map-temporal-cnn: Atharva's map-temporal sparsity-invariant CNN + his guidance stack
#                     (runs in MATLAB through matlab/runGuidanceBridge.m)
#   map-correction:   Atharva's barrier/map-correction controller (Python port)
controller:
  name: map-temporal-cnn
  # Checkpoint (.pt) or exported model.mat. Relative paths are relative to the ARES folder.
  # An existing export in results/map_temporal_exports with the same checkpoint hash is reused.
  model_path: "../Map Temporal Sparsity Invariant CNN_Latest/best.pt"
  # Guidance after the reconstruction (ares.mapTemporal.defaultOptions):
  #   planner:  trajectory-sampling local planner + braking governor (default, his latest)
  #   governor: VFH + braking governor
  #   vfh:      original VFH/PID (legacy)
  guidance: planner
  # Windows Python with torch/numpy/scipy, only needed for the first export of a new .pt.
  # Environment variable ARES_EXPORT_PYTHON overrides this.
  export_python: ""

# Mission and controller options; any field of ares.navigation.defaultOptions.
mission:
  StartState: [0, 0, -7, 0, 0, 0]     # NED [N E D vN vE vD]
  GoalState: [30, 35, -7, 0, 0, 0]
  NumberOfOutages: 5                  # intermittent mode, as in Atharva's run command
  StopTimeS: 60

# Start points (NED metres). Altitude stays 7 m (Down = -7); every scenario and
# seed is flown from each start. The goal stays mission.GoalState (30, 35).
# Both straight lines to the goal are blocked by buildings, so the drone must
# navigate between them.
starts:
  - {id: W1, north: 15, east: 0, note: "west edge between buildings; straight path blocked by 3 buildings"}
  - {id: W2, north: 25, east: 0, note: "north-west; straight path grazes the northern building"}

seeds: [1, 2, 3]

# Wind levels (m/s). Gust peaks: light 3, medium 6 (agreed), strong 8 (limit test). See ares_gz/wind.py.
# Gusts start inside gust_window_s (default 2-22 s, which covers a ~30 s single-drone flight).
wind_profiles:
  calm:   {mean_speed_mps: 0.0, gust_peak_mps: 0.0, gust_count: 0, turbulence_sigma_mps: 0.0}
  light:  {mean_speed_mps: 1.0, gust_peak_mps: 3.0, gust_count: 4, turbulence_sigma_mps: 0.3}
  medium: {mean_speed_mps: 2.0, gust_peak_mps: 6.0, gust_count: 4, turbulence_sigma_mps: 0.6}
  strong: {mean_speed_mps: 3.0, gust_peak_mps: 8.0, gust_count: 4, turbulence_sigma_mps: 0.9}

scenarios:
  - {id: S0_baseline,                   lidar: healthy,      wind: calm,   note: "control run: healthy lidar, no wind"}
  - {id: S1_intermittent,               lidar: intermittent, wind: calm,   note: "1. intermittent lidar failures"}
  - {id: S2_blackout,                   lidar: blackout,     wind: calm,   note: "2. complete lidar blackout"}
  - {id: S3_gusts_light,                lidar: healthy,      wind: light,  note: "3. wind gusts (light)"}
  - {id: S3_gusts_medium,               lidar: healthy,      wind: medium, note: "3. wind gusts (medium)"}
  - {id: S3_gusts_strong,               lidar: healthy,      wind: strong, note: "3. wind gusts (strong, limit test)"}
  - {id: S4_gusts_light_intermittent,   lidar: intermittent, wind: light,  note: "4. gusts + intermittent (light)"}
  - {id: S4_gusts_medium_intermittent,  lidar: intermittent, wind: medium, note: "4. gusts + intermittent (medium)"}
  - {id: S4_gusts_strong_intermittent,  lidar: intermittent, wind: strong, note: "4. gusts + intermittent (strong)"}
  - {id: S5_gusts_light_blackout,       lidar: blackout,     wind: light,  note: "5. gusts + blackout (light)"}
  - {id: S5_gusts_medium_blackout,      lidar: blackout,     wind: medium, note: "5. gusts + blackout (medium)"}
  - {id: S5_gusts_strong_blackout,      lidar: blackout,     wind: strong, note: "5. gusts + blackout (strong)"}
